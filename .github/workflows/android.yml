name: Build VOICE FX PRO APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Python for source checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated parameters and Kotlin sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
          python tools/gen_params.py --check
          python tools/check_native_sync.py
          python tools/lint_kotlin.py

      - name: Run native DSP tests
        run: bash native_tests/run_all.sh

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-FX-PRO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
